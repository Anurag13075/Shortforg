# Zerops Recipe for ShortsForge
# Full-stack Node.js + Vite Studio with native FFmpeg & SQLite persistence

zerops:
  - setup: nodejs
    build:
      base: nodejs@22
      buildCommands:
        # Build server (TypeScript -> server/dist)
        - cd server && npm install && npm run build
        # Build client (Vite -> client/dist)
        - cd client && npm install && npm run build
      deployFiles:
        - server/dist
        - server/package.json
        - server/node_modules
        - client/dist
        - package.json

    run:
      base: nodejs@22
      prepareCommands:
        # Install FFmpeg, fonts, and yt-dlp for resilient video processing & download
        - sudo apk add --no-cache ffmpeg ttf-dejavu fontconfig yt-dlp || apk add --no-cache ffmpeg ttf-dejavu fontconfig yt-dlp
      start: node server/dist/index.js
      ports:
        - port: 3001
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: 3001
