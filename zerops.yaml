# Zerops Recipe for ShortsForge
# Full-stack Node.js + Vite Studio with native FFmpeg & SQLite persistence

zerops:
  - setup: nodejs
    build:
      base: nodejs@22
      buildCommands:
        # Build server (TypeScript -> server/dist)
        - cd server && npm install && npm run build
        # Build client (Vite -> client/dist)
        - cd client && npm install && npm run build
      deployFiles:
        - server/dist
        - server/package.json
        - server/node_modules
        - client/dist
        - package.json

    run:
      base: nodejs@22
      prepareCommands:
        # Install FFmpeg, fonts, python3, and yt-dlp with standalone binary fallback
        - sudo apk add --no-cache ffmpeg ttf-dejavu fontconfig python3 yt-dlp || apk add --no-cache ffmpeg ttf-dejavu fontconfig python3 yt-dlp || (curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && chmod a+rx /usr/local/bin/yt-dlp)
      start: node server/dist/index.js
      ports:
        - port: 3001
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: 3001
