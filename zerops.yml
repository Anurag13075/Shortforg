# Zerops Recipe for ShortsForge
# Full-stack Node.js + Vite Studio with native FFmpeg & SQLite persistence

zerops:
  - setup: nodejs
    build:
      base: nodejs@22
      buildCommands:
        # Build server (TypeScript -> server/dist)
        - cd server && npm install && npm run build
        # Build client (Vite -> client/dist)
        - cd client && npm install && npm run build
      deployFiles:
        - server/dist
        - server/fonts
        - server/package.json
        - server/node_modules
        - client/dist
        - package.json

    run:
      base: nodejs@22
      prepareCommands:
        # Install FFmpeg, fonts, gcompat, python3, pip, and pure-Python yt-dlp with EJS solver natively on Alpine
        - apk add --no-cache ffmpeg ttf-dejavu fontconfig python3 py3-pip gcompat curl ca-certificates || true
        - mkdir -p /usr/share/fonts/truetype/custom && cp server/fonts/*.ttf /usr/share/fonts/truetype/custom/ 2>/dev/null || true
        - fc-cache -f 2>/dev/null || true
        - python3 -m pip install --no-cache-dir --break-system-packages -U yt-dlp yt-dlp-ejs || pip3 install --no-cache-dir -U yt-dlp yt-dlp-ejs || apk add --no-cache yt-dlp || true
      start: node server/dist/index.js
      volume:
        hostname: storage
        mountPath: /mnt/storage
        readOnly: false
      ports:
        - port: 3001
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: 3001
        STORAGE_DIR: /mnt/storage/videos
        DATA_DIR: /mnt/storage/data
        DB_PATH: /mnt/storage/data/shortsforge.db
        DATABASE_URL: ${db_connectionString}
        S3_ENDPOINT: ${s3_apiUrl}
        S3_ACCESS_KEY_ID: ${s3_accessKeyId}
        S3_SECRET_ACCESS_KEY: ${s3_secretAccessKey}
        S3_BUCKET: ${s3_bucketName}
