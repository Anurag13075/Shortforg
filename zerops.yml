# Zerops Recipe for ShortsForge
# Full-stack Node.js + Vite Studio with native FFmpeg & SQLite persistence

zerops:
  - setup: nodejs
    build:
      base: nodejs@22
      buildCommands:
        # Build server (TypeScript -> server/dist)
        - cd server && npm install && npm run build
        # Build client (Vite -> client/dist)
        - cd client && npm install && npm run build
      deployFiles:
        - server/dist
        - server/fonts
        - server/package.json
        - server/node_modules
        - client/dist
        - package.json

    run:
      base: nodejs@22
      prepareCommands:
        # Install FFmpeg, fonts, gcompat, python3, pip, and pure-Python yt-dlp natively on Alpine
        - apk add --no-cache ffmpeg ttf-dejavu fontconfig python3 py3-pip gcompat curl ca-certificates || true
        - mkdir -p /usr/share/fonts/truetype/custom && cp server/fonts/*.ttf /usr/share/fonts/truetype/custom/ 2>/dev/null || true
        - fc-cache -f 2>/dev/null || true
        - python3 -m pip install --no-cache-dir --break-system-packages -U yt-dlp || pip3 install --no-cache-dir -U yt-dlp || apk add --no-cache yt-dlp || true
      start: node server/dist/index.js
      ports:
        - port: 3001
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: 3001
